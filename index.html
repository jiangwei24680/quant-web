<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>量化市场看板</title>
<style>
:root{
  --bg:#0d1117; --card:#161b22; --border:#30363d;
  --text:#e6edf3; --dim:#8b949e;
  --red:#f85149; --green:#3fb950;
}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:12px;max-width:720px;margin:0 auto}
header{text-align:center;padding:10px 0 14px}
header h1{font-size:20px;font-weight:700}
header .date{color:var(--dim);font-size:13px;margin-top:4px}
section.card{background:var(--card);border:1px solid var(--border);border-radius:10px;padding:12px;margin-bottom:12px}
section h2{font-size:15px;margin-bottom:10px}
section h2 .sub{color:var(--dim);font-size:11px;font-weight:400;margin-left:6px}
.overview{display:flex;gap:8px}
.stat{flex:1;text-align:center;background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:10px 4px}
.stat .v{font-size:19px;font-weight:700}
.stat .l{font-size:12px;color:var(--dim);margin-top:4px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{color:var(--dim);font-weight:400;text-align:right;padding:6px 4px;border-bottom:1px solid var(--border)}
th:first-child,th:nth-child(2){text-align:left}
td{padding:7px 4px;border-bottom:1px solid #1c2128;text-align:right;font-variant-numeric:tabular-nums}
td:first-child,td:nth-child(2){text-align:left}
td .code{color:var(--dim);font-size:11px;display:block}
td.concepts{font-size:11px;color:var(--dim);line-height:1.5;max-width:130px}
td.concepts b{font-weight:400;color:#c9d1d9}
tbody tr[data-code]{cursor:pointer}
tbody tr[data-code]:active{background:#1c2128}
.hint{color:var(--dim);font-size:11px;margin-top:8px}
.up{color:var(--red)} .dn{color:var(--green)}
tr:last-child td{border-bottom:none}
footer{text-align:center;color:var(--dim);font-size:11px;padding:18px 0 26px;line-height:1.8}
#error{display:none;background:#3d1d1d;border:1px solid #7a2e2e;color:#ffb4a9;border-radius:8px;padding:12px;font-size:13px;margin-bottom:12px;text-align:center}
#detail{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50}
#detail .panel{position:absolute;inset:auto 0 0 0;max-height:92vh;overflow-y:auto;background:var(--card);border-radius:14px 14px 0 0;padding:14px 12px 20px;max-width:720px;margin:0 auto}
#detail h3{font-size:16px}
#detail h3 .code{color:var(--dim);font-size:12px;font-weight:400;margin-left:6px}
#closeDetail{float:right;background:none;border:1px solid var(--border);color:var(--text);border-radius:6px;padding:4px 12px;font-size:13px}
.chartTitle{font-size:13px;color:var(--dim);margin:14px 0 6px}
canvas{width:100%;display:block;background:#0d1117;border:1px solid var(--border);border-radius:8px}
.loading{color:var(--dim);font-size:13px;padding:16px 0;text-align:center}
.score{font-weight:700}
.globals{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-bottom:12px}
.gchip{background:var(--card);border:1px solid var(--border);border-radius:8px;padding:5px 9px;font-size:12px}
.gchip .p{margin-left:5px;font-variant-numeric:tabular-nums}
.strat{color:var(--dim);font-size:12px;line-height:1.6;margin-bottom:10px;background:#0d1117;border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.strat b{color:#c9d1d9;font-weight:600}
.lgroup{padding:7px 0;border-bottom:1px solid #1c2128;font-size:13px}
.lgroup:last-child{border-bottom:none}
.lgroup .b{display:inline-block;min-width:52px;font-weight:700}
.lgroup .s{display:inline-block;background:#0d1117;border:1px solid var(--border);border-radius:6px;padding:2px 8px;margin:2px 4px 2px 0;font-size:12px;cursor:pointer}
.lgroup .s i{color:var(--dim);font-style:normal;margin-left:4px;font-size:11px}
.lsum{font-size:13px;margin-bottom:6px}
</style>
</head>
<body>
<header>
  <h1>量化市场看板</h1>
  <div class="date">数据日期：<span id="date">加载中…</span></div>
</header>

<div id="error">数据加载失败，请稍后刷新重试。</div>

<div class="globals" id="globals"></div>

<section class="card">
  <h2>市场概览</h2>
  <div class="overview">
    <div class="stat"><div class="v" id="total">–</div><div class="l">股票总数</div></div>
    <div class="stat"><div class="v up" id="up">–</div><div class="l">上涨家数</div></div>
    <div class="stat"><div class="v dn" id="down">–</div><div class="l">下跌家数</div></div>
    <div class="stat"><div class="v" id="flat">–</div><div class="l">平盘家数</div></div>
  </div>
</section>

<section class="card">
  <h2>量化选股榜<span class="sub">策略卡</span></h2>
  <p class="strat" id="stratMeta">策略加载中…</p>
  <table><thead><tr><th>股票</th><th>相关概念</th><th>现价</th><th>今日</th><th>总分</th></tr></thead>
  <tbody id="screen"></tbody></table>
  <p class="hint">点任意股票查看 60 日 K 线和今日分时。</p>
</section>

<section class="card">
  <h2>连板梯队<span class="sub">涨停情绪</span></h2>
  <div id="ladder"><p class="hint">加载中…</p></div>
</section>

<section class="card">
  <h2>主力资金净流入 Top20</h2>
  <table><thead><tr><th>股票</th><th>相关概念</th><th>现价</th><th>涨跌幅</th><th>净流入(亿)</th></tr></thead>
  <tbody id="top-in"></tbody></table>
</section>

<section class="card">
  <h2>主力资金净流出 Top20</h2>
  <table><thead><tr><th>股票</th><th>相关概念</th><th>现价</th><th>涨跌幅</th><th>净流出(亿)</th></tr></thead>
  <tbody id="top-out"></tbody></table>
</section>

<footer>数据来自东方财富公开接口，仅供研究参考，不构成投资建议。</footer>

<div id="detail">
  <div class="panel">
    <button id="closeDetail">关闭</button>
    <h3><span id="dName">—</span><span class="code" id="dCode"></span></h3>
    <div class="chartTitle">60 日 K 线（前复权，含 MA5/10/20/60 与成交量）</div>
    <canvas id="kCanvas" height="240"></canvas>
    <div class="chartTitle">今日分时（最新分钟线）</div>
    <canvas id="mCanvas" height="180"></canvas>
    <div class="loading" id="dLoading">加载中…</div>
  </div>
</div>

<script src="app.js?v=3"></script>
</body>
</html>
